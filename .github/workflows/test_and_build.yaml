name: Test and Build

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependecies
        run: pip install -r requierements.txt
      - name: Check linting
        run: python -m ruff check .
      - name: Test with pytest
        run: python -m pytest
